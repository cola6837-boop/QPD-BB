
name: Compilar APK Elantra Premium V3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Preparar proyecto Android
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Elantra_Premium_V3_Permisos_Ajustados.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::No se encuentra $ZIP en la raiz del repositorio"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          BUILD=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$BUILD" ]; then
            echo "::error::El ZIP no contiene un proyecto Android Gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Elantra-Premium-V3-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
